<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Are you?</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; background: #000; color: #fff; overflow: hidden; font-family: Georgia, "Times New Roman", serif; }
  #stage { height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; }
  #txt { font-size: clamp(34px, 12vw, 110px); margin: 0 0 4vh; font-weight: normal; text-shadow: 0 0 12px rgba(255,255,255,.7), 0 0 30px rgba(160,180,255,.5); }
  #faces { display: flex; width: 100%; max-width: 900px; justify-content: space-around; align-items: center; }
  .face { width: 22vw; max-width: 190px; height: auto; filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 16px rgba(160,180,255,.8)); animation: wob 1.6s ease-in-out infinite; }
  .face:nth-child(2) { animation-delay: .4s; }
  .face:nth-child(3) { animation-delay: .8s; }
  .face circle.o, .face path { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; }
  .face .eye { fill: none; stroke: #fff; stroke-width: 4; transform-box: fill-box; transform-origin: center; animation: blink 2.4s infinite; }
  .face:nth-child(2) .eye.r { animation: wink 1.6s infinite; }
  @keyframes wob { 0%,100% { transform: translateY(0) rotate(-3deg) scale(1); } 50% { transform: translateY(-1.5vh) rotate(3deg) scale(1.06); } }
  @keyframes blink { 0%,90%,100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
  @keyframes wink { 0%,40%,100% { transform: scaleY(1); } 50%,70% { transform: scaleY(.1); } }
  #dlg { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); width: min(320px, 88vw); background: #ece9d8; color: #000; border: 2px solid #0a246a; font: 15px Tahoma, Arial, sans-serif; box-shadow: 4px 4px 0 rgba(255,255,255,.12); }
  #dlg .bar { background: linear-gradient(#0a5fd8, #2a7bef); color: #fff; padding: 5px 8px; font-weight: bold; }
  #dlg .body { padding: 18px 14px; display: flex; gap: 12px; align-items: center; color: #000; }
  #dlg .x { width: 28px; height: 28px; border-radius: 50%; background: #d11; color: #fff; display: grid; place-items: center; font-weight: bold; flex: none; }
  #dlg .btns { display: flex; justify-content: center; gap: 14px; padding: 0 12px 16px; }
  #dlg button { font: 15px Tahoma, Arial, sans-serif; color: #000; min-width: 88px; padding: 8px 12px; background: #f4f3ee; border: 1px solid #333; border-radius: 3px; }
  #dlg button:active { background: #d8d6cc; }
</style>
</head>
<body>
<div id="dlg">
  <div class="bar">Are you?</div>
  <div class="body"><div class="x">×</div><div>Are you an idiot?</div></div>
  <div class="btns"><button id="yes">Yes</button><button id="no">No</button></div>
</div>
<div id="stage">
  <h1 id="txt">you are an idiot</h1>

  </div>
</div>
